name: test
on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        go-version:
          - "1.25"
          - "1.24"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6.0.0
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6.1.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run tests
        run: make test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5.5.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: shogo82148/go-rdsdata

  cdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.0
      - name: Set up Node.js
        uses: actions/setup-node@v6.0.0
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
        working-directory: _integration/_cdk
      - name: Run CDK tests
        run: npm test
        working-directory: _integration/_cdk
